[build]
  publish = "."

[[redirects]]
  from = "/artykul"
  to = "/artykul.html"
  status = 200

[[redirects]]
  from = "/artykuly" 
  to = "/artykuly.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"