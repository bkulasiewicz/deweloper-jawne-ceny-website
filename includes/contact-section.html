<!-- Contact Section -->
<section id="kontakt" class="contact">
    <div class="container">
        <div class="contact__wrapper">
            <div class="contact__info">
                <h2>Skontaktuj się z nami</h2>
                <p>Masz pytania? Potrzebujesz pomocy z wdrożeniem? Napisz do nas!</p>
                
                <div class="contact__details">
                    <div class="contact__item">
                        <span class="contact__icon">📧</span>
                        <div>
                            <strong>Email</strong>
                            <a href="mailto:bartosz.kulasiewicz@gmail.com">bartosz.kulasiewicz@gmail.com</a>
                        </div>
                    </div>
                    <div class="contact__item">
                        <span class="contact__icon">⏱️</span>
                        <div>
                            <strong>Czas odpowiedzi</strong>
                            <span>Do 24 godzin w dni robocze</span>
                        </div>
                    </div>
                    <div class="contact__item">
                        <span class="contact__icon">🎯</span>
                        <div>
                            <strong>Wsparcie techniczne</strong>
                            <span>Pomoc przy instalacji i konfiguracji</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="contact__form-wrapper">
                <form id="contact-form" class="contact__form">
                    <div class="form-group">
                        <label for="contact-email">Twój email *</label>
                        <input 
                            type="email" 
                            id="contact-email" 
                            name="email" 
                            required 
                            placeholder="jan.kowalski@firma.pl"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="contact-subject">Temat</label>
                        <select id="contact-subject" name="subject">
                            <option value="general">Pytanie ogólne</option>
                            <option value="technical">Pomoc techniczna</option>
                            <option value="pricing">Pytanie o cennik</option>
                            <option value="implementation">Wdrożenie 24h</option>
                            <option value="other">Inne</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="contact-message">Wiadomość *</label>
                        <textarea 
                            id="contact-message" 
                            name="message" 
                            required 
                            rows="5" 
                            placeholder="Opisz czego potrzebujesz..."
                        ></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="consent" required>
                            <span>Wyrażam zgodę na przetwarzanie danych osobowych w celu odpowiedzi na zapytanie</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn--primary btn--large">
                        <span class="btn-text">Wyślij wiadomość</span>
                        <span class="btn-loading" style="display: none;">Wysyłanie...</span>
                    </button>
                    
                    <div id="form-message" class="form-message"></div>
                </form>
            </div>
        </div>
    </div>
</section>
