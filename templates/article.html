<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO - unikalne dla kazdego artykulu -->
    <title>{{TITLE}} | DeweloperJawneCeny</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://www.deweloperjawneceny.pl/artykuly/{{SLUG}}/">
    <meta property="og:site_name" content="DeweloperJawneCeny">

    <!-- Article metadata -->
    <meta property="article:published_time" content="{{DATE}}">
    <meta property="article:section" content="{{CATEGORY}}">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.deweloperjawneceny.pl/artykuly/{{SLUG}}/">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/android-chrome-512x512.png">

    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org Article -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{TITLE}}",
        "description": "{{DESCRIPTION}}",
        "datePublished": "{{DATE}}",
        "dateModified": "{{DATE}}",
        "author": {
            "@type": "Organization",
            "name": "DeweloperJawneCeny",
            "url": "https://www.deweloperjawneceny.pl"
        },
        "publisher": {
            "@type": "Organization",
            "name": "DeweloperJawneCeny",
            "url": "https://www.deweloperjawneceny.pl"
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://www.deweloperjawneceny.pl/artykuly/{{SLUG}}/"
        }
    }
    </script>
    {{FAQ_SCHEMA}}

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FD09Q6E775"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FD09Q6E775');
    </script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Article -->
    <article class="article-page">
        <div class="container">
            <div class="article-header">
                <div class="breadcrumb">
                    <a href="/">Strona glowna</a> / <a href="/artykuly/">Artykuly</a> / <span>{{TITLE_SHORT}}</span>
                </div>
                <h1>{{TITLE}}</h1>
                <div class="article-meta">
                    <span class="article-date">{{DATE_FORMATTED}}</span>
                    <span class="article-category">{{CATEGORY}}</span>
                </div>
            </div>

            <div class="article-content" id="article-content">
                {{CONTENT}}
            </div>

            <!-- Article FAQ Section -->
            {{FAQ_HTML}}
        </div>
    </article>

    <!-- Contact Section -->
    <div id="contact-placeholder"></div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="/assets/js/include.js"></script>
    <script src="/assets/js/faq-loader.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
